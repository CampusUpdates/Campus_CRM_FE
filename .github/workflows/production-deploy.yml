name: Campus CRM Frontend - Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-crm-frontend-production
  cancel-in-progress: false

jobs:
  build-and-check:
    name: Lint and Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (existing issues are non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build production frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.campusupdates.com

  deploy-production:
    name: Deploy to Hostinger Production
    runs-on: ubuntu-latest
    needs: build-and-check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy frontend to production VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu

            cd /var/www/campus-crm-frontend

            echo "===== CHECK PRODUCTION REPOSITORY ====="

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Production has uncommitted tracked changes."
              echo "Deployment aborted."
              exit 1
            fi

            if ! grep -Fxq 'VITE_API_URL=https://api.campusupdates.com' .env.production; then
              echo "ERROR: Production API URL is missing or incorrect."
              exit 1
            fi

            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            DEPLOY_ID=$(date +%Y%m%d-%H%M%S)

            BACKUP_DIR="/var/backups/campus-crm-frontend/github-deploy-$DEPLOY_ID"
            OLD_DIST="dist-rollback-$DEPLOY_ID"

            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"

            echo "===== BACK UP CURRENT PRODUCTION BUILD ====="

            cp -a dist "$BACKUP_DIR/dist"
            chmod -R go-rwx "$BACKUP_DIR"

            echo "Previous commit: $PREVIOUS_COMMIT"

            HEALTHY=0

            echo "===== FETCH LATEST FRONTEND ====="

            if git fetch origin main &&
               git reset --hard origin/main &&
               npm ci &&
               rm -rf dist-next &&
               npx tsc -b &&
               npx vite build --outDir dist-next; then

              if [ -s dist-next/index.html ] &&
                 grep -R -Fq 'https://api.campusupdates.com' dist-next &&
                 ! grep -R -Fq 'http://localhost:3000' dist-next; then

                echo "===== BUILD VERIFIED ====="

                if mv dist "$OLD_DIST" &&
                   mv dist-next dist &&
                   curl -fsS --max-time 10 \
                     --resolve crm.campusupdates.com:443:127.0.0.1 \
                     https://crm.campusupdates.com/ > /dev/null; then

                  HEALTHY=1
                fi
              else
                echo "ERROR: Build output or API URL verification failed."
              fi
            fi

            if [ "$HEALTHY" -eq 1 ]; then
              echo "===== FRONTEND DEPLOYMENT SUCCESSFUL ====="
              rm -rf "$OLD_DIST"
              echo "Backup retained at: $BACKUP_DIR"
              exit 0
            fi

            echo "===== DEPLOYMENT FAILED: STARTING ROLLBACK ====="

            rm -rf dist-next

            if [ -d "$OLD_DIST" ]; then
              rm -rf dist
              mv "$OLD_DIST" dist
            elif [ ! -d dist ]; then
              cp -a "$BACKUP_DIR/dist" dist
            fi

            git reset --hard "$PREVIOUS_COMMIT"

            if curl -fsS --max-time 10 \
                 --resolve crm.campusupdates.com:443:127.0.0.1 \
                 https://crm.campusupdates.com/ > /dev/null; then

              echo "Rollback successful. Previous frontend restored."
            else
              echo "CRITICAL: Rollback completed but website health check failed."
            fi

            exit 1
