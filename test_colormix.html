<!DOCTYPE html>
<html>
<head>
<style>
.pill {
  display: inline-flex;
  padding: 4px 12px;
  border-radius: 9999px;
  border: 1px solid color-mix(in srgb, currentColor 40%, transparent);
  background-color: color-mix(in srgb, currentColor 15%, transparent);
  font-weight: bold;
}
</style>
</head>
<body>
  <span class="pill" style="color: blue;">Blue Pill</span>
  <span class="pill" style="color: green;">Green Pill</span>
  <span class="pill" style="color: purple;">Purple Pill</span>
</body>
</html>
